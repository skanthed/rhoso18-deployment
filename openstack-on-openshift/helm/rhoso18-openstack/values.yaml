# values.yaml — OAC (Open Accelerator Cluster) environment
#
# All environment-specific parameters for the RHOSO18 deployment.
#
# SECURITY NOTICE:
#   Switch credentials (ip, username, password, secret) are NOT in this file.
#   Inject them at install time via --set-string or an external secrets manager.
#   The osp-secret and neutron-switch-config Secrets are applied manually outside
#   of Helm and are not rendered by this chart.

# ---------------------------------------------------------------------------
# Cluster identity
# ---------------------------------------------------------------------------
cluster:
  domain: rhoso-oac.cluster.com

# ---------------------------------------------------------------------------
# OpenShift control-plane nodes
# Each entry drives one NodeNetworkConfigurationPolicy (NNCP).
# ---------------------------------------------------------------------------
nodes:
  - name: master-0
    hostname: master-0.rhoso-oac.cluster.com
    ctlplane:
      ip: 192.168.122.10
    internalapi:
      ip: 172.17.0.10
    tenant:
      ip: 172.19.0.10
    ironic:
      ip: 172.20.1.16

  - name: master-1
    hostname: master-1.rhoso-oac.cluster.com
    ctlplane:
      ip: 192.168.122.11
    internalapi:
      ip: 172.17.0.11
    tenant:
      ip: 172.19.0.11
    ironic:
      ip: 172.20.1.17

  - name: master-2
    hostname: master-2.rhoso-oac.cluster.com
    ctlplane:
      ip: 192.168.122.12
    internalapi:
      ip: 172.17.0.12
    tenant:
      ip: 172.19.0.12
    ironic:
      ip: 172.20.1.18

# ---------------------------------------------------------------------------
# Physical network topology
# ---------------------------------------------------------------------------
networks:
  ctlplane:
    # Native (untagged) address on eno2; no vlan field needed
    nic: eno2
    prefixLength: 24
    cidr: 192.168.122.0/24
    dnsUpstream: 192.168.122.1
    metallbPool: "192.168.122.80-192.168.122.90"
    nad:
      type: macvlan
      master: eno2
      start: 192.168.122.30
      end:   192.168.122.70

  internalapi:
    nic: eno2
    vlan: 20
    prefixLength: 24
    cidr: 172.17.0.0/24
    metallbPool: "172.17.0.80-172.17.0.90"
    nad:
      type: macvlan
      master: internalapi
      start: 172.17.0.30
      end:   172.17.0.70

  tenant:
    nic: eno2
    vlan: 22
    prefixLength: 24
    cidr: 172.19.0.0/24
    metallbPool: "172.19.0.80-172.19.0.90"
    nad:
      type: macvlan
      master: tenant
      start: 172.19.0.30
      end:   172.19.0.70

  ironic:
    nic: eno17
    bridge: ironicbr
    # VLAN sub-interface name is constructed as <bridge>.<vlan>
    vlan: 83
    prefixLength: 24
    cidr: 172.20.1.0/24
    metallbPool: "172.20.1.80-172.20.1.90"
    nad:
      type: macvlan
      master: ironicbr.83
      start: 172.20.1.30
      end:   172.20.1.70
    # bmnet NAD uses the bridge directly (no IPAM)
    bmnet:
      bridge: ironicbr

# ---------------------------------------------------------------------------
# MTU applied to all interfaces
# ---------------------------------------------------------------------------
mtu: 1500

# ---------------------------------------------------------------------------
# MetalLB namespace
# ---------------------------------------------------------------------------
metallb:
  namespace: metallb-system

# ---------------------------------------------------------------------------
# Service VIPs (LoadBalancer IPs assigned from MetalLB pools)
# ---------------------------------------------------------------------------
vips:
  ctlplane:    192.168.122.80
  internalapi: 172.17.0.80
  rabbitmq:    172.17.0.85
  ironic:      172.20.1.80

# ---------------------------------------------------------------------------
# OpenStack namespace and top-level secret reference
# ---------------------------------------------------------------------------
openstack:
  namespace: openstack
  # Name of the pre-existing Secret applied manually before helm install
  secret: osp-secret
  # Filled in after the Ironic provisioning network is created in OpenStack.
  # Leave empty for the first deployment pass; set for the second pass.
  ironic:
    networkUUID: ""

# ---------------------------------------------------------------------------
# LVM storage
# ---------------------------------------------------------------------------
storage:
  namespace: openshift-storage
  storageClass: lvms-local-storage-oac
  deviceClasses:
    - name: vg1-sdb
      default: true
      fstype: xfs
      nodeLabelKey:   lvm
      nodeLabelValue: enabled-sdb
      # Replace with the actual persistent disk path before deploying
      devicePath: /dev/disk/by-path/<persistent-disk-identifier>
      thinPool:
        name:                      thin-pool-1
        sizePercent:               90
        overprovisionRatio:        10
        chunkSize:                 128Ki
        chunkSizeCalculationPolicy: Static
        metadataSize:              1Gi
        metadataSizeCalculationPolicy: Host

    - name: vg1-sda
      default: false
      fstype: xfs
      nodeLabelKey:   lvm
      nodeLabelValue: enabled-sda
      devicePath: /dev/disk/by-path/<persistent-disk-identifier>
      thinPool:
        name:                      thin-pool-2
        sizePercent:               90
        overprovisionRatio:        10
        chunkSize:                 128Ki
        chunkSizeCalculationPolicy: Static
        metadataSize:              1Gi
        metadataSizeCalculationPolicy: Host

# ---------------------------------------------------------------------------
# Neutron GenericSwitch driver — non-secret parameters only.
# Credentials (ip, username, password, secret) must be injected via
#   --set-string switches.dell.ip=...
#   --set-string switches.dell.username=...
#   --set-string switches.dell.password=...
#   --set-string switches.dell.secret=...
# and equivalently for switches.cumulus.*
# ---------------------------------------------------------------------------
switches:
  dell:
    sectionName:      dell-switch
    deviceType:       netmiko_dell_force10
    mac:              68:4f:64:1d:01:d5
    saveConfig:       "True"
    manageVlans:      "false"
    trunkPorts:       portname
    # Injected at install time — do not set here
    ip:       ""
    username: ""
    password: ""
    secret:   ""

  cumulus:
    sectionName:      MOC-DEV-SW1
    deviceType:       netmiko_cumulus_nvue
    mac:              b0:cf:0e:0f:b9:fd
    saveConfig:       "True"
    manageVlans:      "false"
    trunkPorts:       portname
    ip:       ""
    username: ""
    password: ""
    secret:   ""
