{{- $v := .Values }}
---
apiVersion: core.openstack.org/v1beta1
kind: OpenStackControlPlane
metadata:
  name: openstack-control-plane
  namespace: {{ $v.openstack.namespace }}
spec:
  secret: {{ $v.openstack.secret }}
  storageClass: {{ $v.storage.storageClass }}


  # DNS service
  dns:
    template:
      replicas: 3
      options:
        - key: server
          values:
            - {{ $v.networks.ctlplane.dnsUpstream }}
    override:
        service:
          metadata:
            annotations:
              metallb.universe.tf/address-pool: ctlplane
              metallb.universe.tf/allow-shared-ip: ctlplane
              metallb.universe.tf/loadBalancerIPs: {{ $v.vips.ctlplane }}
          spec:
            type: LoadBalancer


  # Identity service (keystone)
  keystone:
    apiOverride:
      route: {}
    template:
      databaseInstance: openstack
      secret: {{ $v.openstack.secret }}
      replicas: 3
      override:
        service:
          internal:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/allow-shared-ip: internalapi
                metallb.universe.tf/loadBalancerIPs: {{ $v.vips.internalapi }}
            spec:
              type: LoadBalancer


  # Image service (glance)
  glance:
    enabled: true
    apiOverrides:
      default:
        route: {}
    template:
      databaseInstance: openstack
      storage:
        storageRequest: 10G
        storageClass: {{ $v.storage.storageClass }}
      secret: {{ $v.openstack.secret }}
      keystoneEndpoint: default
      glanceAPIs:
        default:
          replicas: 3
          type: single
          override:
            service:
              internal:
                metadata:
                  annotations:
                    metallb.universe.tf/address-pool: internalapi
                    metallb.universe.tf/allow-shared-ip: internalapi
                    metallb.universe.tf/loadBalancerIPs: {{ $v.vips.internalapi }}
                spec:
                  type: LoadBalancer
          networkAttachments: []


  # Networking service (neutron)
  neutron:
    apiOverride:
      route: {}
    template:
      replicas: 3
      customServiceConfig: |
        [agent]
        report_interval = 300

        # [ml2_type_flat]
        # flat_networks = ironic

        [ml2_type_vlan]
        network_vlan_ranges = bmnet:51:100

        [ml2]
        type_drivers = geneve,vxlan,vlan,flat,local
        tenant_network_types = vlan
      databaseInstance: openstack
      extraMounts:
      - name: switchConf
        extraVol:
        - volumes:
          - name: neutron-switch-config
            secret:
              secretName: neutron-switch-config
          mounts:
          - name: neutron-switch-config
            mountPath: /etc/neutron/neutron.conf.d/03-ml2-genericswitch.conf
            subPath: 03-ml2-genericswitch.conf
            readOnly: true
      ml2MechanismDrivers:
      - ovn
      - genericswitch
      - baremetal
      secret: {{ $v.openstack.secret }}
      override:
        service:
          internal:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/allow-shared-ip: internalapi
                metallb.universe.tf/loadBalancerIPs: {{ $v.vips.internalapi }}
            spec:
              type: LoadBalancer
      networkAttachments:
        - internalapi


  # OVN backend
  ovn:
    enabled: true
    template:
      ovnController:
        networkAttachment: tenant
        nicMappings:
          bmnet: {{ $v.networks.ironic.bridge }}
      ovnDBCluster:
        ovndbcluster-nb:
          replicas: 1
          dbType: NB
          storageRequest: 10G
          networkAttachment: internalapi
        ovndbcluster-sb:
          replicas: 1
          dbType: SB
          storageRequest: 10G
          networkAttachment: internalapi
      ovnNorthd: {}


  # Memcached cluster
  memcached:
    templates:
      memcached:
        replicas: 1


  # MariaDB Galera clusters (control plane)
  galera:
    templates:
      openstack:
        storageRequest: 5Gi
        secret: {{ $v.openstack.secret }}
        replicas: 1


  # RabbitMQ clusters (control plane)
  rabbitmq:
    templates:
      rabbitmq:
        replicas: 1
        override:
          service:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/loadBalancerIPs: {{ $v.vips.rabbitmq }}
            spec:
              type: LoadBalancer


  # Bare metal provisioning (Ironic)
  ironic:
    enabled: true
    template:
      rpcTransport: oslo
      databaseInstance: openstack
      secret: {{ $v.openstack.secret }}
      ironicAPI:
        replicas: 3
        customServiceConfig: |
          [DEFAULT]
          default_network_interface = neutron

          [neutron]
          cleaning_network = {{ if $v.openstack.ironic.networkUUID }}{{ $v.openstack.ironic.networkUUID }}{{ else }}<ironic_network_uuid>{{ end }}
          provisioning_network = {{ if $v.openstack.ironic.networkUUID }}{{ $v.openstack.ironic.networkUUID }}{{ else }}<ironic_network_uuid>{{ end }}
          inspection_network = {{ if $v.openstack.ironic.networkUUID }}{{ $v.openstack.ironic.networkUUID }}{{ else }}<ironic_network_uuid>{{ end }}
          rescuing_network = {{ if $v.openstack.ironic.networkUUID }}{{ $v.openstack.ironic.networkUUID }}{{ else }}<ironic_network_uuid>{{ end }}
        override:
          service:
            internal:
              metadata:
                annotations:
                  metallb.universe.tf/address-pool: ironic
                  metallb.universe.tf/allow-shared-ip: ironic
                  metallb.universe.tf/loadBalancerIPs: {{ $v.vips.ironic }}
              spec:
                type: LoadBalancer
      ironicConductors:
        - replicas: 3
          customServiceConfig: |
            [DEFAULT]
            default_network_interface = neutron

            [neutron]
            cleaning_network = {{ if $v.openstack.ironic.networkUUID }}{{ $v.openstack.ironic.networkUUID }}{{ else }}<ironic_network_uuid>{{ end }}
            provisioning_network = {{ if $v.openstack.ironic.networkUUID }}{{ $v.openstack.ironic.networkUUID }}{{ else }}<ironic_network_uuid>{{ end }}
            inspection_network = {{ if $v.openstack.ironic.networkUUID }}{{ $v.openstack.ironic.networkUUID }}{{ else }}<ironic_network_uuid>{{ end }}
            rescuing_network = {{ if $v.openstack.ironic.networkUUID }}{{ $v.openstack.ironic.networkUUID }}{{ else }}<ironic_network_uuid>{{ end }}
          storageRequest: 10G
          networkAttachments:
            - ironic
          provisionNetwork: ironic
      ironicInspector:
        replicas: 0
        networkAttachments:
          - ironic
        inspectionNetwork: ironic

      ironicNeutronAgent:
        replicas: 3


  cinder:
    enabled: false
  nova:
    enabled: false
  barbican:
    enabled: false
  swift:
    enabled: false
  placement:
    enabled: false
  telemetry:
    enabled: false
  heat:
    enabled: false
  designate:
    enabled: false
  manila:
    enabled: false
