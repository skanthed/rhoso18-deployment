{{- $v := .Values }}
apiVersion: v1
kind: Service
metadata:
  annotations:
    core.openstack.org/ingress_create: "false"
    metallb.io/ip-allocated-from-pool: ironic
    metallb.universe.tf/address-pool: ironic
    metallb.universe.tf/allow-shared-ip: ironic
    metallb.universe.tf/loadBalancerIPs: {{ $v.vips.ironic }}
  name: dnsmasq-dns-ironic
  namespace: {{ $v.openstack.namespace }}
  labels:
    service: dnsmasq
spec:
  ports:
    - name: dnsmasq
      port: 53
      protocol: UDP
      targetPort: 5353
    - name: dnsmasq-tcp
      port: 53
      protocol: TCP
      targetPort: 5353
  selector:
    service: dnsmasq
  type: LoadBalancer
