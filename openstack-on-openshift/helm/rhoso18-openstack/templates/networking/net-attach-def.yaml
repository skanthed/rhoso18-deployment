        "type": "whereabouts",
        "range": "{{ $v.networks.ctlplane.cidr }}",
        "range_start": "{{ $v.networks.ctlplane.nad.start }}",
        "range_end": "{{ $v.networks.ctlplane.nad.end }}"
      }
    }

---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: tenant
  namespace: {{ $v.openstack.namespace }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "tenant",
      "type": "{{ $v.networks.tenant.nad.type }}",
      "master": "{{ $v.networks.tenant.nad.master }}",
