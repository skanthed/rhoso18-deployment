        "range_start": "{{ $v.networks.tenant.nad.start }}",
        "range_end": "{{ $v.networks.tenant.nad.end }}"
      }
    }

---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  labels:
    osp/net: bmnet
    osp/net-attach-def-type: standard
  name: bmnet
  namespace: {{ $v.openstack.namespace }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "bmnet",
      "type": "bridge",
      "bridge": "{{ $v.networks.ironic.bmnet.bridge }}",
      "ipam": {}
    }

---
