{{- $v := .Values }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: internalapi
  namespace: {{ $v.openstack.namespace }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "internalapi",
      "type": "{{ $v.networks.internalapi.nad.type }}",
      "master": "{{ $v.networks.internalapi.nad.master }}",
      "ipam": {
        "type": "whereabouts",
        "range": "{{ $v.networks.internalapi.cidr }}",
        "range_start": "{{ $v.networks.internalapi.nad.start }}",
        "range_end": "{{ $v.networks.internalapi.nad.end }}"
      }
    }

---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ctlplane
  namespace: {{ $v.openstack.namespace }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "ctlplane",
      "type": "{{ $v.networks.ctlplane.nad.type }}",
      "master": "{{ $v.networks.ctlplane.nad.master }}",
