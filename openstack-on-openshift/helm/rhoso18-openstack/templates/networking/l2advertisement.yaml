---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: ctlplane
  namespace: {{ .Values.metallb.namespace }}
spec:
  ipAddressPools:
    - ctlplane
  interfaces:
    - {{ .Values.networks.ctlplane.nic }}

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: internalapi
  namespace: {{ .Values.metallb.namespace }}
spec:
  ipAddressPools:
    - internalapi
  interfaces:
    - internalapi

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: tenant
  namespace: {{ .Values.metallb.namespace }}
spec:
  ipAddressPools:
    - tenant
  interfaces:
    - tenant

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: ironic
  namespace: {{ .Values.metallb.namespace }}
spec:
  ipAddressPools:
    - ironic
  interfaces:
    - {{ .Values.networks.ironic.bridge }}.{{ .Values.networks.ironic.vlan }}
