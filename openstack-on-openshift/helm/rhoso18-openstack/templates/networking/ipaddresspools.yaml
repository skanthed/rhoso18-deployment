---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ctlplane
  namespace: {{ .Values.metallb.namespace }}
spec:
  addresses:
    - {{ .Values.networks.ctlplane.metallbPool }}
  autoAssign: true
  avoidBuggyIPs: false
---
apiVersion: metallb.io/v1beta1
